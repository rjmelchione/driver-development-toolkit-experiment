[project]
name = "driver-toolkit"
version = "0.1.0"
description = "Driver Development Toolkit – iRacing telemetry coaching analysis"
requires-python = ">=3.11"
dependencies = [
    "pyirsdk>=1.3.5",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
driver-toolkit = "driver_toolkit.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driver_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/driver_toolkit"]
omit = ["src/driver_toolkit/ui/*"]

[tool.coverage.report]
show_missing = true
